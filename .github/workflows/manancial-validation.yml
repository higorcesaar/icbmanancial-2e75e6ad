name: Manancial - validar projeto

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # bun.lock está sincronizado com package.json; package-lock.json é legado.
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run test
      - name: Verificar configuração sem consultar o banco
        run: bun .github/scripts/manancial-db-healthcheck.mjs --validate-only
