name: Manancial - validar tipos, testes e compilação

on:
  pull_request:
  push:
    branches:
      - fix/manancial-recuperacao-de-senha-20261027

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit -p tsconfig.app.json
      - run: bun run test
      - run: bun run build
